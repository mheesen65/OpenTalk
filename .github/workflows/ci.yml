name: CI

on:
  push:
    branches: [production, main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Qt 6, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-multimedia-dev libopus-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package portable ZIP
        run: ./scripts/package_linux.sh -G Ninja

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: opentalk-linux-portable
          path: dist/OpenTalk-*-portable.zip
          if-no-files-found: error

  windows:
    name: Windows (MSVC, Qt 6)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          modules: 'qtmultimedia'
          cache: true

      - name: Install Opus
        shell: pwsh
        run: vcpkg install opus:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
